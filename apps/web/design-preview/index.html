<!doctype html>
<html lang="zh-CN" data-xartifact-palette="iris">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-herald · 管理界面设计预览</title>
    <script>
      // Set appearance before first paint; next-themes owns live system updates.
      ;(() => {
        let palette = 'iris',
          mode = 'system'
        try {
          const saved = localStorage.getItem('xartifact.palette')
          if (['iris', 'ocean', 'jade', 'clay'].includes(saved)) palette = saved
          mode = localStorage.getItem('xartifact.appearance') || 'system'
        } catch {}
        document.documentElement.dataset.xartifactPalette = palette
        const dark =
          mode === 'dark' ||
          (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
