name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - ci/docker
      - ci/**
      - feat/**
      - fix/**
      - refactor/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: ~/Docker/x-llm-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Gateway typecheck
        run: cd apps/gateway && bun run typecheck
      - name: Gateway tests
        run: cd apps/gateway && bun test --reporter=dot
      - name: UI tests
        run: bun run test:ui
      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: E2E tests
        run: cd apps/web && bunx playwright test
      - name: Web SPA build
        run: cd apps/web && bun install && bun run build

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.build-and-push.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        run: |
          cd ${{ env.DEPLOY_DIR }}

          echo "Pulling latest images..."
          docker-compose pull

          echo "Starting services..."
          docker-compose up -d

          echo "Waiting for service to be ready..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # 先检查容器是否存活
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' x-llm-gateway 2>/dev/null || echo "unknown")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
              echo "✗ Container has stopped (status: $CONTAINER_STATUS)"
              echo "Container logs:"
              docker-compose logs gateway
              exit 1
            fi

            # 在容器内用 bun 请求 health 端点（容器内始终是 3000 端口）
            HTTP_CODE=$(docker exec x-llm-gateway bun -e "fetch('http://localhost:3000/api/health').then(r=>console.log(r.status)).catch(()=>console.log(0))" 2>/dev/null || echo "0")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is healthy (HTTP 200)"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "✗ Health check timeout after $MAX_RETRIES attempts (150s)"
              echo "Last HTTP code: $HTTP_CODE"
              echo "Container status: $CONTAINER_STATUS"
              echo "Container logs:"
              docker-compose logs --tail=50 gateway
              exit 1
            fi

            echo "  Attempt $RETRY_COUNT/$MAX_RETRIES (HTTP: $HTTP_CODE), retrying in 5s..."
            sleep 5
          done

          echo ""
          echo "Container status:"
          docker-compose ps

          echo ""
          echo "Cleaning up old images..."
          docker image prune -f

          echo ""
          echo "✓ Deployment completed successfully"

  notify:
    needs: [build, deploy]
    runs-on: self-hosted
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="✅ 部署成功"
            COLOR="green"
          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            STATUS="⏭️ 部署跳过"
            COLOR="grey"
          else
            STATUS="❌ 部署失败"
            COLOR="red"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          # 取第一行作为提交信息
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)

          PAYLOAD=$(jq -n \
            --arg status "$STATUS" \
            --arg color "$COLOR" \
            --arg branch "$REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$FIRST_LINE" \
            --arg actor "$ACTOR" \
            --arg build "$BUILD_RESULT" \
            --arg url "$ACTION_URL" \
            '{
              msg_type: "interactive",
              card: {
                header: {
                  title: { tag: "plain_text", content: "\($status) - x-llm-gateway" },
                  template: $color
                },
                elements: [
                  {
                    tag: "div",
                    fields: [
                      { is_short: true, text: { tag: "lark_md", content: "**分支：**\($branch)" } },
                      { is_short: true, text: { tag: "lark_md", content: "**提交：**\($sha)" } },
                      { is_short: false, text: { tag: "lark_md", content: "**信息：**\($msg)" } },
                      { is_short: true, text: { tag: "lark_md", content: "**触发：**\($actor)" } },
                      { is_short: true, text: { tag: "lark_md", content: "**构建：**\($build)" } }
                    ]
                  },
                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "查看 Action" },
                        url: $url,
                        type: "primary"
                      }
                    ]
                  }
                ]
              }
            }')

          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
