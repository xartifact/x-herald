services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-herald
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # 启动时自动跑 pending migrations；新部署 / 重建镜像后无需手动 psql。
      # 默认 prod 下是 false，但加上这个字段强制开启（gateway 进程就是迁移执行器）。
      MIGRATE_ON_BOOT: 'true'
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      PROVIDER_SKIP_TLS_VERIFY: ${PROVIDER_SKIP_TLS_VERIFY:-true}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gateway-network
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
