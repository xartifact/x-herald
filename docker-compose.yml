services:
  postgres:
    image: postgres:16-alpine
    container_name: x-llm-gateway-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-llm_gateway}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: x-llm-gateway
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # 启动时自动跑 pending migrations；新部署 / 重建镜像后无需手动 psql。
      # 默认 prod 下是 false，但加上这个字段强制开启（gateway 进程就是迁移执行器）。
      MIGRATE_ON_BOOT: 'true'
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSL: 'false'
      GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-unknown}
      APP_VERSION: ${APP_VERSION:-dev}
      PROVIDER_SKIP_TLS_VERIFY: ${PROVIDER_SKIP_TLS_VERIFY:-false}
    ports:
      - '${HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bun -e "fetch(\"http://localhost:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gateway-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  gateway-network:
    driver: bridge
