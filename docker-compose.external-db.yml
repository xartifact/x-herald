services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x-llm-gateway
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      DB_MIGRATIONS_FOLDER: /app/migrations
      PROVIDER_SKIP_TLS_VERIFY: true
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gateway-network
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
