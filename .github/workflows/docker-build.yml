name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - ci/docker
      - feat/**
      - fix/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_DIR: ~/Docker/x-llm-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.build-and-push.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        run: |
          cd ${{ env.DEPLOY_DIR }}

          echo "Pulling latest images..."
          docker-compose pull

          echo "Starting services..."
          docker-compose up -d

          echo "Waiting for service to be ready..."
          MAX_RETRIES=30
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # 先检查容器是否存活
            CONTAINER_STATUS=$(docker inspect --format='{{.State.Status}}' x-llm-gateway 2>/dev/null || echo "unknown")
            if [ "$CONTAINER_STATUS" = "exited" ] || [ "$CONTAINER_STATUS" = "dead" ]; then
              echo "✗ Container has stopped (status: $CONTAINER_STATUS)"
              echo "Container logs:"
              docker-compose logs gateway
              exit 1
            fi

            # 在容器内请求 health 端点（容器内始终是 3000 端口），不依赖 Docker healthcheck 状态
            HTTP_CODE=$(docker exec x-llm-gateway wget -qO /dev/null -S http://localhost:3000/api/health 2>&1 | grep "HTTP/" | awk '{print $2}' || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Service is healthy (HTTP 200)"
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "✗ Health check timeout after $MAX_RETRIES attempts (150s)"
              echo "Last HTTP code: $HTTP_CODE"
              echo "Container status: $CONTAINER_STATUS"
              echo "Container logs:"
              docker-compose logs --tail=50 gateway
              exit 1
            fi

            echo "  Attempt $RETRY_COUNT/$MAX_RETRIES (HTTP: $HTTP_CODE), retrying in 5s..."
            sleep 5
          done

          echo ""
          echo "Container status:"
          docker-compose ps

          echo ""
          echo "Cleaning up old images..."
          docker image prune -f

          echo ""
          echo "✓ Deployment completed successfully"
